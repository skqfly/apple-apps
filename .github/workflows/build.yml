name: Build iOS design

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Render app icon and navigation preview
        run: |
          swift Scripts/render-icon.swift Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          swift Scripts/render-navigation.swift navigation-preview.png

      - name: Build for iOS 26
        run: >
          xcodebuild
          -project SitePublisher.xcodeproj
          -scheme SitePublisher
          -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - uses: actions/upload-artifact@v4
        with:
          name: site-publisher-design
          path: |
            navigation-preview.png
            Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          if-no-files-found: error
