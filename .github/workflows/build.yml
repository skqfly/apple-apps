name: Build iOS apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  site-publisher:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/site-publisher
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        working-directory: .
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Render app icon and navigation preview
        run: |
          swift ../../scripts/render-icon.swift Resources/Brand/site-mark.svg Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          swift Scripts/render-navigation.swift "$RUNNER_TEMP/navigation-preview.png"

      - name: Build unsigned IPA
        run: |
          xcodebuild \
            -project SitePublisher.xcodeproj \
            -scheme SitePublisher \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SitePublisher.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          app="$RUNNER_TEMP/SitePublisher.xcarchive/Products/Applications/SitePublisher.app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry "$RUNNER_TEMP/SitePublisher-unsigned.ipa" Payload
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$RUNNER_TEMP/SitePublisher-unsigned.ipa" "$GITHUB_WORKSPACE/dist/"
          cp "$RUNNER_TEMP/navigation-preview.png" "$GITHUB_WORKSPACE/dist/"
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png "$GITHUB_WORKSPACE/dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: site-publisher-ipa
          path: |
            /tmp/SitePublisher-unsigned.ipa
            /tmp/navigation-preview.png
            apps/site-publisher/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          if-no-files-found: error
