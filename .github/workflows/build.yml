# Build and package Qiye. workflow_dispatch allows rerunning a commit when startup fails.
name: Build Apple apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qiye:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/qiye
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Render original website logo
        run: |
          brew install librsvg
          rsvg-convert -w 930 -h 930 --page-width 1024 --page-height 1024 --left 47 --top 47 --background-color white Resources/Brand/logo.svg -o Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Verify contribution and article models
        run: |
          swiftc -parse-as-library \
            Sources/Qiye/Home/DashboardModels.swift \
            Sources/Qiye/Home/DashboardService.swift \
            Sources/Qiye/Blog/BlogPost.swift Sources/Qiye/GitHub/ContentDate.swift \
            Tests/verify-models.swift -o "$RUNNER_TEMP/verify-models"
          "$RUNNER_TEMP/verify-models"

      - name: Verify authorization and atomic publishing
        run: |
          swiftc -swift-version 5 -parse-as-library \
            Sources/Qiye/GitHub/GitHubRepository.swift Sources/Qiye/GitHub/GitHubError.swift \
            Sources/Qiye/GitHub/ContentDate.swift Sources/Qiye/Account/GitHubCredential.swift \
            Sources/Qiye/Blog/BlogPost.swift Sources/Qiye/Talks/TalkPost.swift \
            Sources/Qiye/Photos/WebsitePhoto.swift ../../Scripts/verify-auth-publishing.swift \
            -o "$RUNNER_TEMP/verify-publishing"
          "$RUNNER_TEMP/verify-publishing"

      - name: Verify content states and retry manifests
        run: |
          swiftc -swift-version 5 -D LIBRARY_VERIFICATION -parse-as-library \
            Sources/Qiye/GitHub/GitHubRepository.swift Sources/Qiye/GitHub/GitHubError.swift \
            Sources/Qiye/GitHub/ContentDate.swift Sources/Qiye/Blog/BlogPost.swift \
            Sources/Qiye/Talks/TalkPost.swift Sources/Qiye/Photos/WebsitePhoto.swift \
            Sources/Qiye/Photos/PhotoDraft.swift Sources/Qiye/Photos/PhotoUploadPreparation.swift \
            Sources/Qiye/Publishing/*.swift Tests/verify-library.swift \
            -o "$RUNNER_TEMP/verify-library"
          "$RUNNER_TEMP/verify-library"

      - name: Archive and package unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -quiet \
            -project Qiye.xcodeproj -scheme Qiye -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Qiye.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DeviceBuild" \
            CODE_SIGNING_ALLOWED=NO archive
          built_app="$RUNNER_TEMP/Qiye.xcarchive/Products/Applications/Qiye.app"
          expected_id=$(/usr/libexec/PlistBuddy -c 'Print :GitHubOAuthClientID' Configuration/Info.plist)
          actual_id=$(/usr/libexec/PlistBuddy -c 'Print :GitHubOAuthClientID' "$built_app/Info.plist")
          test -n "$actual_id" && test "$actual_id" = "$expected_id"
          echo 'Verified OAuth Client ID in archived app Info.plist'
          mkdir -p "$RUNNER_TEMP/package/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$RUNNER_TEMP/Qiye.xcarchive/Products/Applications/Qiye.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/dist/Qiye-unsigned.ipa" Payload
          cp "$GITHUB_WORKSPACE/apps/qiye/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" "$GITHUB_WORKSPACE/dist/"

      - name: Build simulator app
        id: simulator
        run: |
          xcodebuild -quiet \
            -project Qiye.xcodeproj -scheme Qiye -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SimulatorBuild" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES build

      - name: Verify long photo hit area
        run: bash ../../scripts/test-long-photo.sh

      - name: Capture actual app in light and dark
        if: always() && steps.simulator.outcome == 'success'
        run: bash ../../scripts/capture-simulator.sh "$RUNNER_TEMP/SimulatorBuild/Build/Products/Debug-iphonesimulator/Qiye.app" "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiye-build
          path: dist
          if-no-files-found: error
